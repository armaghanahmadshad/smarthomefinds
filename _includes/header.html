    <a href="{{ site.baseurl }}/" class="brand">
      <span class="brand-mark">S</span>
      <span>SmartHome<span class="brand-accent">Finds</span></span>
    </a>
    <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
