<form class="search-form" action="{{ site.baseurl }}/search/" method="get" role="search">
  <label for="site-search" class="visually-hidden">Search guides and products</label>
  <input id="site-search" type="search" name="q" placeholder="Search guides and products…" autocomplete="off" value="{{ include.q }}">
  <button type="submit" class="button">Search</button>
</form>
